[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-lab"
version = "0.1.0a1"
description = "An independent local-first CAD geometry experiment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Hasan Yahşi"}]
dependencies = ["build123d==0.13.0", "ezdxf==1.4.5"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
cad-lab = "cad_lab.cli:main"
cad-lab-serve = "cad_lab.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
